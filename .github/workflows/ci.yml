name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every action is pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: make ci
      - name: Known-vulnerability audit
        run: make audit

  # Resumed upload with real 5 MiB parts against moto, an independent S3 implementation (no Docker).
  s3-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Start moto S3 server
        run: |
          python -m pip install --no-cache-dir "moto[server]==5.2.5"
          moto_server -H 127.0.0.1 -p 5055 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:5055/ && break; sleep 1; done
      - run: npm ci
      - name: End-to-end upload against S3
        env:
          S3_ENDPOINT: http://127.0.0.1:5055
          S3_BUCKET: e2e-bucket
          S3_ACCESS_KEY_ID: testing
          S3_SECRET_ACCESS_KEY: testing
        run: |
          if out=$(npm run --silent e2e:s3 2>&1); then
            echo "$out"; echo "::notice title=S3 end-to-end::$(echo "$out" | grep 'E2E PASS')"
          else
            echo "$out"; echo "::error title=S3 end-to-end::$(echo "$out" | tail -1)"; exit 1
          fi
